<!DOCTYPE html>
<html data-theme="dark">
  <head>
        <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
    <meta name="robots" content="noindex, nofollow">
    <meta name="referrer" content="no-referrer">
    <title>Wall Info Board</title>
    <style>
  :root {
    /* Google's notice banner sits above the app frame and pushes it down, so only a small margin is needed. */
    --banner-space: 1.5rem;
  }
  html[data-theme="dark"] {
    --bg: #000000;
    --card: #111317;
    --text: #f5f5f5;
    --muted: #a3a8b0;
    --line: #2a2e35;
    --accent: #facc15;
    --rain: #60a5fa;
  }
  html[data-theme="light"] {
    --bg: #f4f4f0;
    --card: #ffffff;
    --text: #111111;
    --muted: #555a61;
    --line: #d4d4cf;
    --accent: #ca8a04;
    --rain: #1d4ed8;
  }

  /* 1 rem tracks viewport height so the layout scales with the screen. */
  html { font-size: 2vh; }
  html, body {
    margin: 0;
    height: 100%;
    background: var(--bg);
    color: var(--text);
    font-family: Roboto, "Helvetica Neue", Arial, sans-serif;
    overflow: hidden;
    -webkit-user-select: none;
    user-select: none;
  }
  * { box-sizing: border-box; }

  .board {
    display: -webkit-box;
    display: flex;
    height: 100%;
    padding: var(--banner-space) 2rem 1.5rem;
  }
  .pane { min-width: 0; }
  .pane-left {
    flex: 0 0 52%;
    padding-right: 2rem;
    display: flex;
    flex-direction: column;
  }
  .pane-right {
    flex: 1 1 auto;
    padding-left: 2rem;
    border-left: 1px solid var(--line);
    display: flex;
    flex-direction: column;
  }

  .clock {
    font-size: 11rem;
    font-weight: 300;
    line-height: 1;
    letter-spacing: -0.02em;
    font-variant-numeric: tabular-nums;
  }
  .date {
    margin-top: 0.75rem;
    font-size: 2.6rem;
    color: var(--muted);
  }

  .agenda {
    flex: 1 1 auto;
    min-height: 0;
    overflow: hidden;
    margin-top: 1.5rem;
  }
  .agenda-day { margin-bottom: 1rem; }
  .agenda-heading {
    font-size: 1.6rem;
    color: var(--muted);
    text-transform: uppercase;
    letter-spacing: 0.06em;
    margin-bottom: 0.4rem;
  }
  .event {
    display: flex;
    align-items: baseline;
    border-left: 0.5rem solid var(--muted);
    padding: 0.2rem 0 0.2rem 0.9rem;
    margin-bottom: 0.4rem;
    font-size: 1.9rem;
    white-space: nowrap;
    overflow: hidden;
  }
  .agenda-today .event { font-size: 2.3rem; }
  .event-time {
    flex: 0 0 auto;
    min-width: 5.2em;
    color: var(--muted);
    font-variant-numeric: tabular-nums;
  }
  .event-title { flex: 0 1 auto; overflow: hidden; text-overflow: ellipsis; }
  .event-loc {
    flex: 0 1 auto;
    margin-left: 0.8rem;
    font-size: 0.75em;
    color: var(--muted);
    overflow: hidden;
    text-overflow: ellipsis;
  }
  .event-all-day { background: var(--card); }
  .agenda-empty { font-size: 1.9rem; color: var(--muted); }
  .pane-left .status { text-align: left; }

  .icon { display: block; }
  .icon * {
    fill: none;
    stroke: currentColor;
    stroke-width: 3;
    stroke-linecap: round;
    stroke-linejoin: round;
  }
  .icon .cloud { fill: var(--bg); }
  .icon .sun { color: var(--accent); }
  .icon .drop { color: var(--rain); }

  .now {
    display: flex;
    align-items: center;
  }
  .now .icon { width: 8rem; height: 8rem; flex: 0 0 auto; }
  .now-main { margin-left: 1.5rem; }
  .now-temp { font-size: 6rem; line-height: 1; font-weight: 300; }
  .now-desc { font-size: 2.2rem; margin-top: 0.25rem; }
  .now-meta { font-size: 1.6rem; color: var(--muted); margin-top: 0.3rem; white-space: nowrap; }

  .hourly {
    display: flex;
    margin-top: 1.5rem;
    padding: 0.8rem 0;
    border-top: 1px solid var(--line);
    border-bottom: 1px solid var(--line);
  }
  .hour {
    flex: 1 1 0;
    text-align: center;
    min-width: 0;
  }
  .hour-time { font-size: 1.5rem; color: var(--muted); white-space: nowrap; }
  .hour .icon { width: 2.8rem; height: 2.8rem; margin: 0.3rem auto; }
  .hour-temp { font-size: 1.7rem; }
  .hour-pop { font-size: 1.2rem; color: var(--rain); min-height: 1.5rem; }

  .daily { margin-top: 0.5rem; }
  .day {
    display: flex;
    align-items: center;
    padding: 0.3rem 0;
    font-size: 2rem;
  }
  .day-name { flex: 0 0 7rem; }
  .day .icon { width: 2.8rem; height: 2.8rem; margin-right: 1rem; }
  .day-pop { flex: 0 0 5rem; font-size: 1.5rem; color: var(--rain); }
  .day-temps { flex: 1 1 auto; text-align: right; }
  .day-min { color: var(--muted); margin-left: 1rem; }

  .status {
    margin-top: auto;
    font-size: 1.4rem;
    color: var(--muted);
    text-align: right;
  }
  .status-warn { color: var(--accent); }

  /* View states: the board stays underneath; slideshow and night cover it. */
  .overlay {
    position: fixed;
    top: 0; right: 0; bottom: 0; left: 0;
    background: #000;
    color: #f5f5f5;
    opacity: 0;
    visibility: hidden;
    transition: opacity 1s ease, visibility 0s linear 1s;
  }
  .state-slideshow #slideshow,
  .state-night #night {
    opacity: 1;
    visibility: visible;
    transition: opacity 1s ease, visibility 0s linear 0s;
  }
  .slides { position: absolute; top: 0; right: 0; bottom: 0; left: 0; }
  .slide {
    position: absolute;
    top: 0; left: 0;
    width: 100%;
    height: 100%;
    opacity: 0;
    transition: opacity 1.5s ease;
  }
  .slide.show { opacity: 1; }
  .slide.quick { transition-duration: 0.3s; }
  .slide.fit-cover { object-fit: cover; }
  .slide.fit-contain { object-fit: contain; }
  .nav {
    position: absolute;
    top: 50%;
    margin-top: -4.5rem;
    width: 6rem;
    height: 9rem;
    padding: 1.5rem 0.8rem;
    border: 0;
    border-radius: 1rem;
    background: rgba(0, 0, 0, 0.25);
    color: rgba(255, 255, 255, 0.55);
    -webkit-tap-highlight-color: transparent;
    outline: none;
  }
  .nav:active { background: rgba(0, 0, 0, 0.55); color: #fff; }
  .nav.busy { animation: nav-pulse 0.8s ease-in-out infinite; }
  @keyframes nav-pulse {
    0%, 100% { background: rgba(0, 0, 0, 0.25); }
    50% { background: rgba(255, 255, 255, 0.3); }
  }
  .nav-prev { left: 1.5rem; }
  .nav-next { right: 1.5rem; }
  .nav svg {
    width: 100%;
    height: 100%;
    fill: none;
    stroke: currentColor;
    stroke-width: 2.5;
    stroke-linecap: round;
    stroke-linejoin: round;
  }
  .corner {
    position: absolute;
    right: 2rem;
    bottom: 1.5rem;
    text-align: right;
    text-shadow: 0 0 0.6rem rgba(0, 0, 0, 0.9);
  }
  .corner-clock { font-size: 5rem; font-weight: 300; line-height: 1; font-variant-numeric: tabular-nums; }
  .corner-weather { display: flex; align-items: center; justify-content: flex-end; font-size: 2.4rem; margin-top: 0.3rem; }
  .corner-weather .icon { width: 2.8rem; height: 2.8rem; margin-right: 0.6rem; }
  .corner-weather .icon .cloud { fill: rgba(0, 0, 0, 0.4); }
  .corner-note { font-size: 1.4rem; color: #facc15; margin-top: 0.4rem; max-width: 40rem; }
  .debug {
    position: fixed;
    left: 0; right: 0; bottom: 0;
    z-index: 10;
    padding: 0.2rem 0.6rem;
    font: 1.1rem/1.3 monospace;
    color: #facc15;
    background: rgba(0, 0, 0, 0.7);
    pointer-events: none;
  }
  .debug:empty { display: none; }
  .night-clock {
    position: absolute;
    top: 50%;
    left: 0;
    right: 0;
    margin-top: -2.5rem;
    text-align: center;
    font-size: 5rem;
    font-weight: 300;
    color: #1c1c1c;
  }
</style>

  </head>
  <body>
    <main class="board">
      <section class="pane pane-left">
        <div class="clock" id="clock">--:--</div>
        <div class="date" id="date"></div>
        <div class="agenda" id="agenda"></div>
        <div class="status" id="board-status"></div>
      </section>
      <section class="pane pane-right">
        <div class="now" id="now"></div>
        <div class="hourly" id="hourly"></div>
        <div class="daily" id="daily"></div>
        <div class="status" id="weather-status"></div>
      </section>
    </main>
    <div class="overlay" id="slideshow">
      <div class="slides" id="slides"></div>
      <button class="nav nav-prev" id="nav-prev" aria-label="Previous photo">
        <svg viewBox="0 0 24 24" aria-hidden="true"><polyline points="15,4 7,12 15,20"/></svg>
      </button>
      <button class="nav nav-next" id="nav-next" aria-label="Next photo">
        <svg viewBox="0 0 24 24" aria-hidden="true"><polyline points="9,4 17,12 9,20"/></svg>
      </button>
      <div class="corner">
        <div class="corner-clock" id="slide-clock"></div>
        <div class="corner-weather" id="slide-weather"></div>
        <div class="corner-note" id="slide-note"></div>
      </div>
    </div>
    <div class="debug" id="debug"></div>
    <div class="overlay" id="night">
      <div class="night-clock" id="night-clock"></div>
    </div>
    <script>var BOOT = null;</script>
    <script>
  // Plain ES5 on purpose: the tablet runs an older Android WebView.
  (function () {
    'use strict';

    // Served by Apps Script, BOOT is filled in by doGet. As a static page (GitHub Pages) BOOT is null
    // and the key and deployment ID come from the URL fragment: #d=<deployment id>&k=<key>.
    // The fragment never leaves the browser, so the static host never sees either.
    var boot = BOOT || bootFromHash();
    var isStatic = !BOOT;
    var settings = boot.settings || {};
    var WEATHER_REFRESH_MS = 30 * 60 * 1000;
    var WEATHER_RETRY_MS = 5 * 60 * 1000;
    var WEATHER_STALE_MS = 45 * 60 * 1000;
    var RELOAD_HOUR = 4;
    var MIN_UPTIME_BEFORE_RELOAD_MS = 60 * 60 * 1000;
    var STORAGE_WEATHER = 'wib.weather.v1';
    var BOARD_REFRESH_MS = 5 * 60 * 1000;
    var BOARD_STALE_MS = 20 * 60 * 1000;
    var STORAGE_BOARD = 'wib.board.v1';
    var DEFAULT_EVENT_COLOR = '#9ca3af';
    var VIEW_CHECK_MS = 5000;
    var NIGHT_PEEK_MS = 30 * 1000;
    var FADE_MS = 1500;
    var QUICK_FADE_MS = 300; // Crossfade after an arrow press.
    var PHOTO_BLOB_CACHE = 4; // Recent photos kept compressed, so back/forward needs no download.
    var PHOTO_LIST_MAX_AGE_MS = 30 * 60 * 1000;
    var PHOTO_RETRY_MS = 5000;
    var PHOTO_HISTORY_MAX = 50;

    var DAYS = ['Sunday', 'Monday', 'Tuesday', 'Wednesday', 'Thursday', 'Friday', 'Saturday'];
    var DAYS_SHORT = ['Sun', 'Mon', 'Tue', 'Wed', 'Thu', 'Fri', 'Sat'];
    var MONTHS = ['January', 'February', 'March', 'April', 'May', 'June', 'July',
      'August', 'September', 'October', 'November', 'December'];

    var startedAt = Date.now();
    var weather = null; // { fetchedAt: ms, data: Open-Meteo response }
    var lastWeatherError = false;
    var weatherTimer = null;
    var lastRenderedHour = null;
    var board = null; // { fetchedAt: ms, data: getBoard() result }
    var lastBoardError = false;
    var lastBoardErrorText = '';

    function bootFromHash() {
      var params = {};
      var parts = window.location.hash.replace(/^#/, '').split('&');
      for (var i = 0; i < parts.length; i++) {
        var kv = parts[i].split('=');
        if (kv[0]) params[decodeURIComponent(kv[0])] = decodeURIComponent(kv.slice(1).join('='));
      }
      var deployment = /^[A-Za-z0-9_-]+$/.test(params.d || '') ? params.d : '';
      return {
        key: params.k || '',
        api: deployment ? 'https://script.google.com/macros/s/' + deployment + '/exec' : '',
        settings: null,
        debug: params.debug === '1'
      };
    }

    function $(id) { return document.getElementById(id); }
    function pad(n) { return n < 10 ? '0' + n : String(n); }
    function escapeHtml(text) {
      return String(text).replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;')
        .replace(/"/g, '&quot;').replace(/'/g, '&#39;');
    }

    // localStorage can be missing or throw in a kiosk WebView; never let that break the board.
    function save(key, value) {
      try { window.localStorage.setItem(key, JSON.stringify(value)); } catch (e) {}
    }
    function load(key) {
      try {
        var raw = window.localStorage.getItem(key);
        return raw ? JSON.parse(raw) : null;
      } catch (e) {
        return null;
      }
    }

    // ---------- Icons (inline SVG, WMO weather codes) ----------

    var CLOUD = 'M20 46h26a10 10 0 0 0 0-20a14 14 0 0 0-27-3a11 11 0 0 0 1 23z';
    var CLOUD_HIGH = 'M20 38h26a10 10 0 0 0 0-20a14 14 0 0 0-27-3a11 11 0 0 0 1 23z';
    var MOON = 'M38 10a20 20 0 1 0 16 30a16 16 0 1 1-16-30z';

    function sunShape(cx, cy, r, ray) {
      var out = '<g class="sun"><circle cx="' + cx + '" cy="' + cy + '" r="' + r + '"/>';
      for (var i = 0; i < 8; i++) {
        var a = i * Math.PI / 4;
        var x1 = cx + Math.cos(a) * (r + 4), y1 = cy + Math.sin(a) * (r + 4);
        var x2 = cx + Math.cos(a) * (r + 4 + ray), y2 = cy + Math.sin(a) * (r + 4 + ray);
        out += '<line x1="' + x1.toFixed(1) + '" y1="' + y1.toFixed(1) +
          '" x2="' + x2.toFixed(1) + '" y2="' + y2.toFixed(1) + '"/>';
      }
      return out + '</g>';
    }
    function cloud(d) { return '<path class="cloud" d="' + d + '"/>'; }
    function lines(pairs, cls) {
      var out = '<g class="' + cls + '">';
      for (var i = 0; i < pairs.length; i++) {
        var p = pairs[i];
        out += '<line x1="' + p[0] + '" y1="' + p[1] + '" x2="' + p[2] + '" y2="' + p[3] + '"/>';
      }
      return out + '</g>';
    }

    var ICONS = {
      clearDay: sunShape(32, 32, 11, 7),
      clearNight: '<path d="' + MOON + '"/>',
      partlyDay: '<g transform="translate(-6 -6) scale(0.8)">' + sunShape(32, 32, 10, 6) + '</g>' + cloud(CLOUD),
      partlyNight: '<g transform="translate(-4 -6) scale(0.6)"><path d="' + MOON + '"/></g>' + cloud(CLOUD),
      cloudy: cloud(CLOUD),
      fog: lines([[12, 26, 52, 26], [8, 36, 48, 36], [16, 46, 56, 46]], 'fog'),
      drizzle: cloud(CLOUD_HIGH) + lines([[24, 46, 23, 49], [34, 46, 33, 49], [44, 46, 43, 49],
        [29, 54, 28, 57], [39, 54, 38, 57]], 'drop'),
      rain: cloud(CLOUD_HIGH) + lines([[24, 44, 20, 54], [34, 44, 30, 54], [44, 44, 40, 54]], 'drop'),
      snow: cloud(CLOUD_HIGH) + lines([[24, 45, 24, 53], [20, 49, 28, 49], [40, 45, 40, 53],
        [36, 49, 44, 49], [32, 54, 32, 62], [28, 58, 36, 58]], 'snow'),
      thunder: cloud(CLOUD_HIGH) + '<polyline class="sun" points="34,40 27,50 35,50 29,61"/>'
    };

    var CODES = [
      // [codes, day icon, night icon, label]
      [[0], 'clearDay', 'clearNight', 'Clear'],
      [[1], 'partlyDay', 'partlyNight', 'Mainly clear'],
      [[2], 'partlyDay', 'partlyNight', 'Partly cloudy'],
      [[3], 'cloudy', 'cloudy', 'Overcast'],
      [[45, 48], 'fog', 'fog', 'Fog'],
      [[51, 53, 55], 'drizzle', 'drizzle', 'Drizzle'],
      [[56, 57], 'drizzle', 'drizzle', 'Freezing drizzle'],
      [[61, 63, 65], 'rain', 'rain', 'Rain'],
      [[66, 67], 'rain', 'rain', 'Freezing rain'],
      [[71, 73, 75, 77], 'snow', 'snow', 'Snow'],
      [[80, 81, 82], 'rain', 'rain', 'Rain showers'],
      [[85, 86], 'snow', 'snow', 'Snow showers'],
      [[95, 96, 99], 'thunder', 'thunder', 'Thunderstorm']
    ];

    function describe(code) {
      for (var i = 0; i < CODES.length; i++) {
        if (CODES[i][0].indexOf(code) !== -1) return CODES[i];
      }
      return [[], 'cloudy', 'cloudy', ''];
    }
    function iconSvg(code, isDay) {
      var entry = describe(code);
      var name = isDay === 0 ? entry[2] : entry[1];
      return '<svg class="icon" viewBox="0 0 64 64" aria-hidden="true">' + ICONS[name] + '</svg>';
    }

    // ---------- Clock ----------

    function renderClock(now) {
      var time = pad(now.getHours()) + ':' + pad(now.getMinutes());
      $('clock').textContent = time;
      $('slide-clock').textContent = time;
      $('night-clock').textContent = time;
      $('date').textContent = DAYS[now.getDay()] + ', ' + now.getDate() + ' ' + MONTHS[now.getMonth()];
    }

    function maybeDailyReload(now) {
      if (now.getHours() !== RELOAD_HOUR || now.getMinutes() !== 0) return;
      if (Date.now() - startedAt < MIN_UPTIME_BEFORE_RELOAD_MS) return;
      if (isStatic) {
        window.location.reload();
        return;
      }
      // The page runs inside Apps Script's sandbox iframes; reload the top-level page when allowed.
      try {
        window.top.location.replace(boot.url + '?k=' + encodeURIComponent(boot.key));
      } catch (e) {
        window.location.reload();
      }
    }

    function tick() {
      var now = new Date();
      renderClock(now);
      if (now.getHours() !== lastRenderedHour) renderWeather();
      renderWeatherStatus();
      renderAgenda();
      renderBoardStatus();
      maybeDailyReload(now);
      // Align the next tick to just after the minute boundary.
      var msToNextMinute = 60000 - (now.getSeconds() * 1000 + now.getMilliseconds());
      setTimeout(tick, msToNextMinute + 50);
    }

    // ---------- Weather ----------

    function weatherUrl() {
      var params = [
        'latitude=' + settings.lat,
        'longitude=' + settings.lon,
        'timezone=' + encodeURIComponent(settings.timezone),
        'current=temperature_2m,apparent_temperature,weather_code,is_day',
        'hourly=temperature_2m,precipitation_probability,weather_code,is_day',
        'daily=weather_code,temperature_2m_max,temperature_2m_min,precipitation_probability_max,sunrise,sunset',
        'forecast_days=5'
      ];
      if (settings.units === 'imperial') params.push('temperature_unit=fahrenheit');
      return 'https://api.open-meteo.com/v1/forecast?' + params.join('&');
    }

    function fetchWeather() {
      if (settings.lat === undefined) return; // No settings yet; the first board brings them.
      var xhr = new XMLHttpRequest();
      xhr.open('GET', weatherUrl());
      xhr.timeout = 20000;
      xhr.onload = function () {
        var data = null;
        if (xhr.status === 200) {
          try { data = JSON.parse(xhr.responseText); } catch (e) {}
        }
        if (data && data.current && data.hourly && data.daily) {
          weather = { fetchedAt: Date.now(), data: data };
          lastWeatherError = false;
          save(STORAGE_WEATHER, weather);
          renderWeather();
          renderWeatherStatus();
          scheduleWeather(WEATHER_REFRESH_MS);
        } else {
          onWeatherError();
        }
      };
      xhr.onerror = onWeatherError;
      xhr.ontimeout = onWeatherError;
      xhr.send();
    }

    function onWeatherError() {
      lastWeatherError = true;
      renderWeatherStatus();
      scheduleWeather(WEATHER_RETRY_MS);
    }

    function scheduleWeather(ms) {
      clearTimeout(weatherTimer);
      weatherTimer = setTimeout(fetchWeather, ms);
    }

    function deg(value) { return Math.round(value) + '&deg;'; }
    function hhmm(isoLocal) { return isoLocal.slice(11, 16); }
    function pop(value) { return value === null || value === undefined || value < 10 ? '' : value + '%'; }

    // Index of the current local hour in Open-Meteo's local-time series (falls back to the API's "now").
    function currentHourIndex(times, fallbackIso) {
      var now = new Date();
      var key = now.getFullYear() + '-' + pad(now.getMonth() + 1) + '-' + pad(now.getDate()) +
        'T' + pad(now.getHours()) + ':00';
      var i = times.indexOf(key);
      if (i === -1) i = times.indexOf(fallbackIso.slice(0, 13) + ':00');
      return i;
    }

    function todayIndex(dates) {
      var now = new Date();
      var key = now.getFullYear() + '-' + pad(now.getMonth() + 1) + '-' + pad(now.getDate());
      var i = dates.indexOf(key);
      return i === -1 ? 0 : i;
    }

    function renderWeather() {
      lastRenderedHour = new Date().getHours();
      if (!weather) return;
      var d = weather.data;
      var c = d.current, h = d.hourly, day = d.daily;
      var t = todayIndex(day.time);

      $('slide-weather').innerHTML = iconSvg(c.weather_code, c.is_day) + deg(c.temperature_2m);
      $('now').innerHTML =
        iconSvg(c.weather_code, c.is_day) +
        '<div class="now-main">' +
          '<div class="now-temp">' + deg(c.temperature_2m) + '</div>' +
          '<div class="now-desc">' + describe(c.weather_code)[3] + '</div>' +
          '<div class="now-meta">Feels ' + deg(c.apparent_temperature) +
            ' &middot; H ' + deg(day.temperature_2m_max[t]) + ' L ' + deg(day.temperature_2m_min[t]) + '</div>' +
          '<div class="now-meta">Sunrise ' + hhmm(day.sunrise[t]) + ' &middot; Sunset ' + hhmm(day.sunset[t]) + '</div>' +
        '</div>';

      var html = '';
      var start = currentHourIndex(h.time, c.time) + 1;
      for (var i = start; start > 0 && i < start + 12 && i < h.time.length; i++) {
        html += '<div class="hour">' +
          '<div class="hour-time">' + h.time[i].slice(11, 13) + '</div>' +
          iconSvg(h.weather_code[i], h.is_day[i]) +
          '<div class="hour-temp">' + deg(h.temperature_2m[i]) + '</div>' +
          '<div class="hour-pop">' + pop(h.precipitation_probability[i]) + '</div>' +
          '</div>';
      }
      $('hourly').innerHTML = html;

      html = '';
      for (var j = t; j < t + 5 && j < day.time.length; j++) {
        var parts = day.time[j].split('-');
        var date = new Date(+parts[0], +parts[1] - 1, +parts[2]);
        html += '<div class="day">' +
          '<div class="day-name">' + (j === t ? 'Today' : DAYS_SHORT[date.getDay()]) + '</div>' +
          iconSvg(day.weather_code[j], 1) +
          '<div class="day-pop">' + pop(day.precipitation_probability_max[j]) + '</div>' +
          '<div class="day-temps">' + deg(day.temperature_2m_max[j]) +
            '<span class="day-min">' + deg(day.temperature_2m_min[j]) + '</span></div>' +
          '</div>';
      }
      $('daily').innerHTML = html;
    }

    function ago(ms) {
      var min = Math.round(ms / 60000);
      if (min < 60) return min + ' min ago';
      var hours = Math.round(min / 60);
      if (hours < 48) return hours + ' h ago';
      return Math.round(hours / 24) + ' days ago';
    }

    function renderWeatherStatus() {
      var el = $('weather-status');
      if (!weather) {
        el.className = 'status' + (lastWeatherError ? ' status-warn' : '');
        el.textContent = lastWeatherError ? 'Weather unavailable' : 'Loading weather';
        return;
      }
      var age = Date.now() - weather.fetchedAt;
      var stale = lastWeatherError || age > WEATHER_STALE_MS;
      el.className = 'status' + (stale ? ' status-warn' : '');
      el.textContent = stale ? 'Weather updated ' + ago(age) : '';
    }

    // ---------- Calendar ----------

    function dayKey(date) {
      return date.getFullYear() + '-' + pad(date.getMonth() + 1) + '-' + pad(date.getDate());
    }
    function keyToDate(key) {
      var p = key.split('-');
      return new Date(+p[0], +p[1] - 1, +p[2]);
    }
    function addDays(key, n) {
      var d = keyToDate(key);
      d.setDate(d.getDate() + n);
      return dayKey(d);
    }
    function dayHeading(key, todayKey) {
      if (key === todayKey) return 'Today';
      if (key === addDays(todayKey, 1)) return 'Tomorrow';
      var d = keyToDate(key);
      return DAYS[d.getDay()] + ' ' + d.getDate() + ' ' + MONTHS[d.getMonth()].slice(0, 3);
    }
    function safeColor(color) {
      return /^#[0-9a-fA-F]{3,8}$/.test(color || '') ? color : DEFAULT_EVENT_COLOR;
    }

    // Groups events by display day: all-day events on every day they cover,
    // timed events on their start day (or today, if they started earlier and are still on).
    function groupByDay(events, todayKey, lastKey) {
      var days = {};
      function add(key, item) {
        if (!days[key]) days[key] = { allDay: [], timed: [] };
        days[key][item.event.allDay ? 'allDay' : 'timed'].push(item);
      }
      var nowMs = Date.now();
      for (var i = 0; i < events.length; i++) {
        var e = events[i];
        if (e.allDay) {
          var key = e.start < todayKey ? todayKey : e.start;
          for (var guard = 0; key < e.end && key <= lastKey && guard < 60; guard++) {
            add(key, { event: e });
            key = addDays(key, 1);
          }
        } else {
          if (new Date(e.end).getTime() <= nowMs) continue;
          var startKey = e.start.slice(0, 10);
          var shown = startKey < todayKey ? todayKey : startKey;
          if (shown > lastKey) continue;
          add(shown, { event: e, continued: startKey < shown });
        }
      }
      return days;
    }

    function eventHtml(item, dayKeyShown) {
      var e = item.event;
      var time;
      if (e.allDay) time = '';
      else if (!item.continued) time = e.start.slice(11, 16);
      else time = e.end.slice(0, 10) === dayKeyShown ? 'until ' + e.end.slice(11, 16) : '';
      return '<div class="event' + (e.allDay ? ' event-all-day' : '') +
        '" style="border-left-color:' + safeColor(e.color) + '">' +
        (e.allDay ? '' : '<span class="event-time">' + time + '</span>') +
        // dir="auto": Hebrew (or any right-to-left) titles lay out and truncate on their own side.
        '<span class="event-title" dir="auto">' + escapeHtml(e.title) + '</span>' +
        (e.location ? '<span class="event-loc" dir="auto">' + escapeHtml(e.location) + '</span>' : '') +
        '</div>';
    }

    function renderAgenda() {
      var el = $('agenda');
      if (!board) {
        el.innerHTML = '';
        return;
      }
      var todayKey = dayKey(new Date());
      var daysAhead = board.data.settings.days_ahead || 7;
      var lastKey = addDays(todayKey, daysAhead);
      var days = groupByDay(board.data.events, todayKey, lastKey);
      var html = '';
      for (var key = todayKey, n = 0; key <= lastKey && n <= daysAhead; key = addDays(key, 1), n++) {
        var day = days[key];
        if (!day && key !== todayKey) continue;
        html += '<div class="agenda-day' + (key === todayKey ? ' agenda-today' : '') + '">' +
          '<div class="agenda-heading">' + dayHeading(key, todayKey) + '</div>';
        if (!day) {
          html += '<div class="agenda-empty">Nothing else today</div>';
        } else {
          var items = day.allDay.concat(day.timed);
          for (var i = 0; i < items.length; i++) html += eventHtml(items[i], key);
        }
        html += '</div>';
      }
      el.innerHTML = html;
    }

    function loadBoard() {
      if (!isStatic) {
        google.script.run
          .withSuccessHandler(onBoard)
          .withFailureHandler(function (err) { onBoardError(err && err.message); })
          .getBoard(boot.key);
        return;
      }
      if (!boot.api || !boot.key) {
        onBoardError('Missing #d=...&k=... in the page URL');
        return;
      }
      var xhr = new XMLHttpRequest();
      xhr.open('GET', boot.api + '?api=board&k=' + encodeURIComponent(boot.key));
      xhr.timeout = 30000;
      xhr.onload = function () {
        var data = null;
        try { data = JSON.parse(xhr.responseText); } catch (e) {}
        if (xhr.status === 200 && data && !data.error) onBoard(data);
        else onBoardError(data && data.error ? data.error : 'HTTP ' + xhr.status);
      };
      xhr.onerror = function () { onBoardError(''); };
      xhr.ontimeout = function () { onBoardError(''); };
      xhr.send();
    }

    // Settings come from the config Sheet via the board, so Sheet edits apply without a reload.
    function applySettings(next) {
      var weatherChanged = next.lat !== settings.lat || next.lon !== settings.lon ||
        next.units !== settings.units || next.timezone !== settings.timezone;
      settings = next;
      applyTheme();
      if (weatherChanged) {
        weather = null;
        renderWeather();
        fetchWeather();
      }
    }

    function applyTheme() {
      document.documentElement.setAttribute('data-theme', settings.theme === 'light' ? 'light' : 'dark');
    }

    function onBoard(data) {
      if (data.settings) applySettings(data.settings);
      board = { fetchedAt: Date.now(), data: data };
      lastBoardError = false;
      save(STORAGE_BOARD, board);
      renderAgenda();
      renderBoardStatus();
      setTimeout(loadBoard, BOARD_REFRESH_MS);
    }

    function onBoardError(text) {
      lastBoardError = true;
      lastBoardErrorText = text === 'Forbidden' ? 'Wrong key in the page URL' : text || '';
      renderBoardStatus();
      setTimeout(loadBoard, BOARD_REFRESH_MS);
    }

    function renderBoardStatus() {
      var el = $('board-status');
      var notes = [];
      if (lastBoardErrorText && /key|URL/.test(lastBoardErrorText)) notes.push(lastBoardErrorText);
      if (!board) {
        if (!notes.length) notes.push(lastBoardError ? 'Calendar unavailable' : 'Loading calendar');
      } else {
        var age = Date.now() - board.fetchedAt;
        if (lastBoardError || age > BOARD_STALE_MS) notes.push('Calendar updated ' + ago(age));
        var sources = board.data.sources;
        if (!sources.length) notes.push('Waiting for the first calendar refresh');
        for (var i = 0; i < sources.length; i++) {
          if (!sources[i].ok) notes.push(sources[i].name + ': ' + (sources[i].error || 'not updating'));
        }
      }
      el.className = 'status' + (notes.length ? ' status-warn' : '');
      el.textContent = notes.join(' \u00b7 ');
    }

    // ---------- Photos ----------
    //
    // Two <img> slots crossfade. The hidden slot preloads the next photo, so at most two images
    // are ever decoded. Each photo becomes a blob URL that is revoked as soon as its slot is reused,
    // which keeps memory flat over hours on the tablet.

    // run counts start/stop cycles; callbacks from an earlier run see a different value and bail out.
    var slides = { running: false, run: 0, ids: [], order: [], pos: 0, listedAt: 0, shown: -1,
      nextReady: false, failures: 0, swapTimer: null, retryTimer: null, slots: [],
      history: [], cursor: -1, nextIndex: -1, load: 0, lastSwapAt: 0, lastFadeMs: FADE_MS, blobs: [] };

    function isCurrentRun(run) { return slides.running && slides.run === run; }

    function serverCall(api, params, fn, onOk, onErr) {
      if (!isStatic) {
        var run = google.script.run.withSuccessHandler(onOk)
          .withFailureHandler(function (err) { onErr(err && err.message); });
        run[fn].apply(run, [boot.key].concat(params.id ? [params.id] : []));
        return;
      }
      var url = boot.api + '?api=' + api + '&k=' + encodeURIComponent(boot.key) +
        (params.id ? '&id=' + encodeURIComponent(params.id) : '');
      var xhr = new XMLHttpRequest();
      xhr.open('GET', url);
      xhr.timeout = 60000;
      xhr.onload = function () {
        var data = null;
        try { data = JSON.parse(xhr.responseText); } catch (e) {}
        if (xhr.status === 200 && data && !data.error) onOk(data);
        else onErr(data && data.error ? data.error : 'HTTP ' + xhr.status);
      };
      xhr.onerror = function () { onErr(''); };
      xhr.ontimeout = function () { onErr(''); };
      xhr.send();
    }

    function slot(i) {
      if (!slides.slots.length) {
        for (var n = 0; n < 2; n++) {
          var img = document.createElement('img');
          img.className = 'slide';
          img.alt = '';
          $('slides').appendChild(img);
          slides.slots.push({ img: img, url: null });
        }
      }
      return slides.slots[i];
    }

    function releaseSlot(i) {
      var s = slot(i);
      s.img.className = 'slide';
      s.img.onload = s.img.onerror = null;
      s.img.removeAttribute('src');
      if (s.url) URL.revokeObjectURL(s.url);
      s.url = null;
    }

    function base64ToBlob(base64, mime) {
      var bin = window.atob(base64);
      var bytes = new Uint8Array(bin.length);
      for (var i = 0; i < bin.length; i++) bytes[i] = bin.charCodeAt(i);
      return new Blob([bytes], { type: mime });
    }

    // Small most-recent-first cache of compressed photos. Only the two <img> slots hold decoded images.
    function cachedBlob(id) {
      for (var i = 0; i < slides.blobs.length; i++) {
        if (slides.blobs[i].id === id) return slides.blobs[i].blob;
      }
      return null;
    }

    function rememberBlob(id, blob) {
      slides.blobs = [{ id: id, blob: blob }].concat(slides.blobs.filter(function (b) { return b.id !== id; }))
        .slice(0, PHOTO_BLOB_CACHE);
    }

    function shuffle(list) {
      var a = list.slice();
      for (var i = a.length - 1; i > 0; i--) {
        var j = Math.floor(Math.random() * (i + 1));
        var t = a[i]; a[i] = a[j]; a[j] = t;
      }
      return a;
    }

    function nextPhotoId() {
      if (slides.pos >= slides.order.length) {
        slides.order = shuffle(slides.ids);
        slides.pos = 0;
      }
      return slides.order[slides.pos++];
    }

    function withPhotoList(done) {
      if (slides.ids.length && Date.now() - slides.listedAt < PHOTO_LIST_MAX_AGE_MS) return done();
      serverCall('photos', {}, 'getPhotoList', function (data) {
        slides.ids = data.ids || [];
        slides.listedAt = Date.now();
        slides.order = [];
        slides.pos = 0;
        done();
      }, function (err) { slides.lastError = 'Photo list: ' + (err || 'network error'); done(); });
    }

    // history lists photo ids in the order they were (or will be) shown. cursor is the one on screen,
    // nextIndex the one waiting in the hidden slot. The arrow buttons walk this list, so going back
    // and then forward replays the same photos.
    function upcomingIndex() {
      if (slides.cursor + 1 < slides.history.length) return slides.cursor + 1;
      slides.history.push(nextPhotoId());
      return slides.history.length - 1;
    }

    // Loads history[index] (or the upcoming photo, if index is null) into slot i and calls back
    // done(ok, index) once it is decoded. Each call supersedes any load still in flight.
    function preload(i, wantIndex, done) {
      var run = slides.run;
      var load = ++slides.load;
      function current() { return isCurrentRun(run) && load === slides.load; }
      withPhotoList(function () {
        if (!current()) return;
        if (!slides.ids.length) {
          if (!slides.lastError) slides.lastError = 'Photo list is empty';
          return done(false, -1);
        }
        var index = wantIndex === null ? upcomingIndex() : wantIndex;
        var id = slides.history[index];
        function show(blob) {
          if (!current()) return;
          rememberBlob(id, blob);
          releaseSlot(i);
          var s = slot(i);
          s.url = URL.createObjectURL(blob);
          s.img.onload = function () {
            s.img.onload = s.img.onerror = null;
            if (!current()) return;
            s.img.className = 'slide ' + (s.img.naturalWidth >= s.img.naturalHeight ? 'fit-cover' : 'fit-contain');
            done(true, index);
          };
          s.img.onerror = function () {
            if (!current()) return;
            slides.lastError = 'Photo ' + id + ' is not a readable image';
            releaseSlot(i);
            done(false, index);
          };
          s.img.src = s.url;
        }
        var cached = cachedBlob(id);
        if (cached) return show(cached);
        serverCall('photo', { id: id }, 'getPhoto', function (data) {
          show(base64ToBlob(data.base64, data.mime));
        }, function (err) {
          if (!current()) return;
          slides.lastError = 'Photo ' + id + ': ' + (err || 'network error');
          done(false, index);
        });
      });
    }

    function preloadHidden() {
      var run = slides.run;
      var hidden = slides.shown === 0 ? 1 : 0;
      slides.nextReady = false;
      preload(hidden, null, function (ok, index) {
        if (!isCurrentRun(run)) return;
        if (ok) {
          slides.failures = 0;
          slides.lastError = '';
          slides.nextIndex = index;
          slides.nextReady = true;
          if (slides.shown === -1) swapSlides();
        } else {
          // Drop the broken photo from what's ahead, so the retry tries a different one.
          if (index > slides.cursor) slides.history.splice(index, 1);
          slides.failures++;
          slides.retryTimer = setTimeout(preloadHidden, PHOTO_RETRY_MS * Math.min(slides.failures, 12));
          renderSlideNote();
        }
      });
    }

    function swapSlides(quick) {
      clearTimeout(slides.swapTimer);
      if (!slides.running) return;
      if (!slides.nextReady) {
        slides.swapTimer = setTimeout(swapSlides, 2000); // Still loading; keep the current photo up.
        return;
      }
      var hidden = slides.shown === 0 ? 1 : 0;
      var old = slides.shown;
      var fadeMs = quick === true ? QUICK_FADE_MS : FADE_MS;
      setQuick(slot(hidden).img, quick === true);
      slot(hidden).img.className += ' show';
      if (old !== -1) {
        setQuick(slot(old).img, quick === true);
        slot(old).img.className = slot(old).img.className.replace(/\s*\bshow\b/, '');
      }
      setNavBusy(null);
      slides.shown = hidden;
      slides.cursor = slides.nextIndex;
      slides.nextIndex = -1;
      slides.nextReady = false;
      slides.lastSwapAt = Date.now();
      slides.lastFadeMs = fadeMs;
      if (slides.history.length > PHOTO_HISTORY_MAX) {
        var drop = slides.history.length - PHOTO_HISTORY_MAX;
        slides.history.splice(0, drop);
        slides.cursor -= drop;
      }
      var run = slides.run;
      // Once the fade finishes, free the old photo and start loading the next one into its slot.
      setTimeout(function () {
        if (!isCurrentRun(run)) return;
        if (old !== -1) releaseSlot(old);
        preloadHidden();
      }, fadeMs + 100);
      slides.swapTimer = setTimeout(swapSlides, (settings.photo_seconds || 30) * 1000);
    }

    function setQuick(img, quick) {
      img.className = img.className.replace(/\s*\bquick\b/, '') + (quick ? ' quick' : '');
    }

    // Pulses the pressed arrow while its photo loads.
    function setNavBusy(id) {
      var ids = ['nav-prev', 'nav-next'];
      for (var i = 0; i < ids.length; i++) {
        var el = $(ids[i]);
        el.className = el.className.replace(/\s*\bbusy\b/, '') + (ids[i] === id ? ' busy' : '');
      }
    }

    // Arrow buttons: step = -1 (previous) or +1 (next).
    function navigate(step) {
      if (!slides.running || slides.shown === -1) return;
      // Ignore taps during a crossfade: the fading photo still holds the other slot.
      if (Date.now() - slides.lastSwapAt < slides.lastFadeMs + 200) return;
      var target = slides.cursor + step;
      if (target < 0) return; // Nothing earlier in the history.
      if (step > 0 && slides.nextReady && slides.nextIndex === target) {
        swapSlides(true);
        return;
      }
      setNavBusy(step > 0 ? 'nav-next' : 'nav-prev');
      clearTimeout(slides.swapTimer);
      clearTimeout(slides.retryTimer);
      var run = slides.run;
      var hidden = slides.shown === 0 ? 1 : 0;
      slides.nextReady = false;
      preload(hidden, step > 0 ? null : target, function (ok, index) {
        if (!isCurrentRun(run)) return;
        if (ok) {
          slides.nextIndex = index;
          slides.nextReady = true;
          swapSlides(true);
        } else {
          setNavBusy(null);
          renderSlideNote();
          preloadHidden();
          slides.swapTimer = setTimeout(swapSlides, (settings.photo_seconds || 30) * 1000);
        }
      });
    }

    function startSlideshow() {
      if (slides.running) return;
      slides.running = true;
      slides.run++;
      if (slides.slots.length) { releaseSlot(0); releaseSlot(1); }
      slides.shown = -1;
      slides.failures = 0;
      preloadHidden();
    }

    function stopSlideshow() {
      slides.running = false;
      slides.run++;
      clearTimeout(slides.swapTimer);
      clearTimeout(slides.retryTimer);
      var run = slides.run;
      // Free both photos after the overlay has faded out.
      setTimeout(function () {
        if (slides.running || slides.run !== run) return;
        if (slides.slots.length) { releaseSlot(0); releaseSlot(1); }
        slides.shown = -1;
      }, FADE_MS + 100);
    }

    // ---------- View states ----------
    //
    // board: everything. slideshow: photo + small clock + temp. night: black, very dim clock.
    // trigger('presence') is the single input: a tap calls it today, and a future PIR sensor
    // (the page polling a presence flag) will call the same function. Keep it free of touch details.

    var viewState = null;
    var lastPresence = Date.now();

    function minutesOfDay(hhmm) {
      return +hhmm.slice(0, 2) * 60 + +hhmm.slice(3, 5);
    }

    // "23:00-06:30" style ranges; may cross midnight. Blank or malformed = never.
    function inTimeRange(now, range) {
      if (!range || !/^\d{2}:\d{2}-\d{2}:\d{2}$/.test(range)) return false;
      var t = now.getHours() * 60 + now.getMinutes();
      var start = minutesOfDay(range.slice(0, 5));
      var end = minutesOfDay(range.slice(6, 11));
      if (start === end) return false;
      return start < end ? t >= start && t < end : t >= start || t < end;
    }

    var stateReason = '';

    function decideState(now) {
      if (Date.now() < lastPresence) lastPresence = Date.now(); // Clock moved backwards.
      var idleMs = Date.now() - lastPresence;
      var holdMs = (settings.board_hold_min || 3) * 60 * 1000;
      if (inTimeRange(now, settings.night_hours)) {
        stateReason = idleMs < NIGHT_PEEK_MS ? 'night hours, tapped' : 'night hours ' + settings.night_hours;
        return idleMs < NIGHT_PEEK_MS ? 'board' : 'night';
      }
      if (inTimeRange(now, settings.morning_board)) {
        stateReason = 'morning window ' + settings.morning_board;
        return 'board';
      }
      if (!settings.has_photos) {
        stateReason = settings.lat === undefined ? 'no settings yet' : 'no photos (folder empty, unreadable or not set)';
        return 'board';
      }
      stateReason = 'idle ' + Math.round(idleMs / 1000) + ' s of ' + Math.round(holdMs / 1000) + ' s';
      return idleMs < holdMs ? 'board' : 'slideshow';
    }

    // Shown in the slideshow corner when photos keep failing, so a black screen explains itself.
    function renderSlideNote() {
      var el = $('slide-note');
      el.textContent = slides.running && slides.failures >= 2 ? 'Photos unavailable: ' + slides.lastError : '';
    }

    // #...&debug=1 adds a status line explaining what the board is doing and why.
    function renderDebug() {
      if (!boot.debug) return;
      var el = $('debug');
      var boardAge = board ? Math.round((Date.now() - board.fetchedAt) / 1000) + ' s ago' : 'never';
      el.textContent = 'state ' + viewState + ' (' + stateReason + ') | photos listed ' + slides.ids.length +
        (slides.running ? ', shown slot ' + slides.shown + ', next ' + (slides.nextReady ? 'ready' : 'loading') +
          ', failures ' + slides.failures : '') +
        (slides.lastError ? ' | last error: ' + slides.lastError : '') +
        ' | board data ' + boardAge + ' | hold ' + settings.board_hold_min + ' min, photo ' + settings.photo_seconds +
        ' s, night ' + (settings.night_hours || 'off') + ', morning ' + (settings.morning_board || 'off');
    }

    function setState(next) {
      if (next === viewState) return;
      var cls = document.body.className.replace(/\bstate-\w+\b/g, '').replace(/\s+/g, ' ');
      document.body.className = (cls + ' state-' + next).replace(/^\s+/, '');
      if (next === 'slideshow') startSlideshow();
      else if (viewState === 'slideshow') stopSlideshow();
      viewState = next;
    }

    function trigger(eventName) {
      if (eventName === 'presence') lastPresence = Date.now();
      setState(decideState(new Date()));
      renderSlideNote();
      renderDebug();
    }
    window.trigger = trigger;

    // Taps on the slideshow's arrow buttons navigate photos instead of counting as presence.
    function isInNav(el) {
      for (; el && el !== document; el = el.parentNode) {
        if (typeof el.className === 'string' && /\bnav\b/.test(el.className)) return true;
      }
      return false;
    }

    function onTap(e) {
      if (isInNav(e && e.target)) return;
      trigger('presence');
    }

    // ---------- Start ----------

    weather = load(STORAGE_WEATHER);
    board = load(STORAGE_BOARD);
    if (!boot.settings && board && board.data.settings) settings = board.data.settings;
    applyTheme();
    tick();
    trigger('start');
    setInterval(function () { trigger('check'); }, VIEW_CHECK_MS);
    $('nav-prev').addEventListener('click', function () { navigate(-1); });
    $('nav-next').addEventListener('click', function () { navigate(1); });
    document.addEventListener('touchstart', onTap, true);
    document.addEventListener('mousedown', onTap, true);
    fetchWeather();
    loadBoard();
  })();
